[package]
name = "adh-core"
description = "L'Atlas des harmoniques — moteur de calcul des harmoniques, sans dépendance GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["builtin"]
## Instrumentations embarquées (basse 4/5/6, guitare 6/7/8/12).
builtin = []

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[[bin]]
name = "adh-dump"
path = "src/bin/adh_dump.rs"
